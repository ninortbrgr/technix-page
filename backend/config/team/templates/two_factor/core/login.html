{% extends "two_factor/_base.html" %}
{% load i18n %}

{% block two_factor_content %}
<form method="post" style="display: grid; gap: 20px;">
  {% csrf_token %}
  {{ wizard.management_form }}

  {% if wizard.form.errors %}
  <div style="padding: 12px; border: 1px solid red; border-radius: 12px; color: red; font-size: 0.9rem;">
    ⚠️ Benutzername oder Passwort falsch.
  </div>
  {% endif %}

  {% for field in wizard.form %}
  <div>
    <label style="display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.9rem;">
      {{ field.label }}
    </label>
    <input type="{{ field.field.widget.input_type }}"
           name="{{ field.html_name }}"
           id="{{ field.id_for_label }}"
           {% if field.value %}value="{{ field.value }}"{% endif %}
           style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font-size: 1rem;">
  </div>
  {% endfor %}

  <button type="submit"
    style="padding: 14px; background: var(--accent); color: #08080b; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;">
    {% trans "Anmelden" %}
  </button>
</form>
{% endblock %}
