{% extends 'pages/base.html' %}
{% load static %}

{% block title %}Login – TechniX{% endblock %}
{% block body_class %}page-login{% endblock %}

{% block content %}
<section class="hero">
  <div class="container">
    <div class="hero-card reveal">
      <h1 class="hero-title hero-title-center">
        <img src="{% static 'pictures/logo/technix-transparency.png' %}" 
             alt="TechniX Logo" 
             style="width: 60px; height: 60px; object-fit: contain; display: block; margin: 0 auto 20px;">
        TechniX Login
      </h1>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div style="max-width: 420px; margin: 0 auto; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 20px; padding: 40px;">
      {% block two_factor_content %}{% endblock %}
    </div>
  </div>
</section>
{% endblock %}
