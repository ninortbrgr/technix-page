  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-card reveal">
          <h1 class="hero-title heading-bg hero-title-center" style="--heading-image: url('pictures/index/keller.jpeg');">Einblick in unsere Herzstücke</h1>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <h2 class="section-title section-title-center">Unser bestes Equipment</h2>
        <div class="grid grid-4 reveal">
          <figure class="inventory-card">
            <img src="pictures/inventar/dot2.jpeg" alt="MA Lighting Dot 2 XL-F">
            <figcaption><span class="inventory-name">MA Lighting Dot 2 XL-F</span><span class="inventory-purpose">Unser Lichtpult zum steuern von Licht</span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/gld.jpg" alt="Allen & Heath GLD-80">
            <figcaption><span class="inventory-name">Allen & Heath GLD-80</span><span class="inventory-purpose">Unser Tonpult, zum steuern von Ton</span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/w300.jpeg" alt="Cameo Zenit W300">
            <figcaption><span class="inventory-name">Cameo Zenit W300</span><span class="inventory-purpose">Unsere 4 LED Wash Lights für in- und Outdoor</span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/f2fc.jpg" alt="Cameo F2FC">
            <figcaption><span class="inventory-name">Cameo F2Fc</span><span class="inventory-purpose">Unsere 5 Frensel Spotlights mit Zoom Funktion </span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/tsm15.jpg" alt="Seeburg TSM15 Top">
            <figcaption><span class="inventory-name">Seeburg TSM 15 Top</span><span class="inventory-purpose">Unsere 4 Seeburg TSM15 hängen während Veranstalltungen an der Decke, um den besten Ton zu ermöglichen</span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/tsm10.jpg" alt="Seeburg TSM10 Monitor">
            <figcaption><span class="inventory-name">Seeburg TSM 10 Monitor</span><span class="inventory-purpose">Unsere 4 Seeburg TSM 10 Monitore stehen während Konzerten auf der Bühne, sodass die Musiker sich selbst hören können</span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/magicdot.jpeg" alt="Ayrton Magic-Dot R">
            <figcaption><span class="inventory-name">Ayrton Magic Dot R</span><span class="inventory-purpose">Unsere 8 Magic-Dots Können sich 360 Grad Horizontal und vertikal bewegen.</span></figcaption>
          </figure>
          <figure class="inventory-card">
            <img src="pictures/inventar/led-bar.jpg" alt="Eurolite LED-Bar 252">
            <figcaption><span class="inventory-name">Eurolite LED-Bar 252</span><span class="inventory-purpose">Unsere 10 LED Bars haben drei ansteuerbare Segmente Segmente. Sie haben einen großen Nutztungsbereich</span></figcaption>
          </figure>
        </div>
